services:

  postgres:
    image: postgres:17
    container_name: cyberdefense-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyberdefense

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8
    container_name: cyberdefense-redis
    restart: always

    ports:
      - "6379:6379"


volumes:

  postgres_data: